name: Feature request
description: Suggest a useful change or new content source.
title: "[Idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: What need would this meet?
      description: Tell us who has the need and why it matters.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the change in a few clear sentences.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Helpful examples
      description: Share a safe public example or source if you have one.
